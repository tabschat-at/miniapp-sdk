<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Uploads</title>
    <link rel="stylesheet" href="../shared/style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <h1>My Uploads</h1>
      <p>Sign in with Tabs and save a file to this app’s own server.</p>
      <button id="signin">Sign in with Tabs</button>
      <button id="upload" disabled>Choose and upload a file</button>
      <button id="signout" disabled>Sign out</button>
      <p id="status" role="status">Sign in to continue.</p>
    </main>
  </body>
</html>
